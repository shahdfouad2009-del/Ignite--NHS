/* ============================== HELPERS ============================== */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
};
const fmtDateLong = (d) => {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
};

function isAdminMember(m) {
  return !!(m && (m.isAdmin || m.role === "President"));
}
function canPostAnnouncementFor(m) {
  // returns department string the member can post for, or 'ANY' for admin
  if (!m) return null;
  if (isAdminMember(m)) return "ANY";
  if (DEPT_HEADS.includes(m.role)) return DEPT_LABELS[m.role];
  return null;
}
function canManage(m, section) {
  if (!m) return false;
  if (isAdminMember(m)) return true;
  if (section === "events") return m.role === "Head of Event Planning";
  if (section === "finance") return m.role === "Head of Finance";
  if (section === "secretary") return m.role === "Head of Secretary";
  if (section === "marketing") return false; // Head of Marketing has no edit access — admin only
  if (section === "attendance") return m.role === "Head of Secretary";
  if (section === "warnings") return false; // admin only
  if (section === "members") return false; // admin only
  if (section === "calendar") return m.role === "Head of Event Planning";
  return false;
}
function canView(m, section) {
  if (!m) return false;
  if (isAdminMember(m) || canManage(m, section)) return true;
  if (section === "finance") return m.role === "Finance";
  if (section === "secretary") return m.role === "Secretary";
  if (section === "marketing") return m.role === "Marketing" || m.role === "Head of Marketing";
  return true; // dashboard, announcements, events, calendar, my profile: everyone
}

function attendanceStatsFor(memberId, attendance) {
  const recs = attendance.filter((a) => a.memberId === memberId);
  const present = recs.filter((a) => a.status === "present" || a.status === "excused").length;
  const total = recs.length;
  const pct = total === 0 ? null : Math.round((present / total) * 100);
  return { total, present, pct };
}
function isFlagged(memberId, attendance, warnings) {
  const { pct, total } = attendanceStatsFor(memberId, attendance);
  const wCount = warnings.filter((w) => w.memberId === memberId).length;
  const reasons = [];
  if (total >= 2 && pct !== null && pct < 80) reasons.push(`Attendance ${pct}%`);
  if (wCount >= 2) reasons.push(`${wCount} warnings`);
  return reasons;
}

/* ============================== STORAGE (Firebase) ============================== */
// Data lives in Firestore so every visitor to the site shares the same chapter data.
// Each key below is stored as its own document (collection "ignite_nhs"), keeping every
// document safely under Firestore's 1MB-per-document limit even with photos attached.

const FS_COLLECTION = "ignite_nhs";
const FS_KEYS = ["members", "announcements", "events", "attendance", "warnings", "finance", "minutes", "campaigns"];
const SESSION_KEY = "ignite_nhs_session_member_id";

function defaultMembers() {
  return [
    {
      id: "admin-seed-1",
      name: "Shahd Fouad",
      email: ADMIN_EMAIL,
      role: "President",
      isAdmin: true,
      committee: "Executive Board",
      code: "",
      joinDate: todayStr(),
      status: "active",
    },
  ];
}

async function loadDB() {
  const result = {};
  await Promise.all(
    FS_KEYS.map(async (key) => {
      try {
        const snap = await firestoreDb.collection(FS_COLLECTION).doc(key).get();
        result[key] = snap.exists && Array.isArray(snap.data().items) ? snap.data().items : [];
      } catch (e) {
        console.error(`Failed to load ${key}`, e);
        result[key] = [];
      }
    })
  );
  if (result.members.length === 0) {
    result.members = defaultMembers();
    try {
      await firestoreDb.collection(FS_COLLECTION).doc("members").set({ items: result.members });
    } catch (e) {
      console.error("Failed to seed admin member", e);
    }
  }
  return result;
}

async function saveDB(db) {
  try {
    await Promise.all(
      FS_KEYS.map((key) => firestoreDb.collection(FS_COLLECTION).doc(key).set({ items: db[key] || [] }))
    );
    return true;
  } catch (e) {
    console.error("save failed", e);
    return false;
  }
}

// Session (which member is logged in on this device) is just local to the browser.
async function loadSession() {
  try { return localStorage.getItem(SESSION_KEY); } catch (e) { return null; }
}
async function saveSession(memberId) {
  try { localStorage.setItem(SESSION_KEY, memberId || ""); } catch (e) {}
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ============================== APP ============================== */

export default function App() {

  const [me, setMe] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [navOpen, setNavOpen] = useState(false);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (firebaseInitError) { setLoading(false); return; }
    (async () => {
      const [database, sessionId] = await Promise.all([loadDB(), loadSession()]);
      setDb(database);
      if (sessionId) {
        const found = database.members.find((m) => m.id === sessionId);
        if (found) setMe(found);
      }
      setLoading(false);
    })();
  }, []);

  const persist = useCallback(async (nextDb) => {
    setDb(nextDb);
    setSaving(true);
    await saveDB(nextDb);
    setSaving(false);
  }, []);

  const handleLogin = (member) => {
    setMe(member);
    saveSession(member.id);
    setTab("dashboard");
  };
  const handleLogout = () => {
    setMe(null);
    saveSession("");
  };

  if (firebaseInitError) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
        <div className="max-w-md text-center">

          <h1 className="font-serif text-xl font-bold text-slate-900">Couldn't connect to the database</h1>

        </div>
      </div>
    );

  // Keep `me` synced if db changes (e.g. role updated)
  useEffect(() => {
    if (db && me) {
      const fresh = db.members.find((m) => m.id === me.id);

      if (!fresh) handleLogout();

      <div className="flex">

/* ============================== LOGIN ============================== */

function LoginScreen({ db, onLogin, persist }) {
  const [email, setEmail] = useState("");
  const [code, setCode] = useState("");
  const [stage, setStage] = useState("email"); // email -> code (if needed)
  const [error, setError] = useState("");
  const [matched, setMatched] = useState(null);

  const submitEmail = (e) => {
    e.preventDefault();
    setError("");
    const found = db.members.find((m) => m.email.toLowerCase().trim() === email.toLowerCase().trim());
    if (!found) {
      setError("No member found with that email. Ask your chapter admin to add you.");
      return;
    }
    if (found.status === "inactive") {
      setError("This account is inactive. Contact your chapter admin.");
      return;
    }
    if (found.code) {
      setMatched(found);
      setStage("code");
    } else {
      onLogin(found);
    }
  };
  const submitCode = (e) => {
    e.preventDefault();
    if (code.trim() === matched.code) {
      onLogin(matched);
    } else {
      setError("Incorrect access code.");
    }
  };

  return (
    <div className="min-h-screen bg-gradient-to-b from-blue-900 to-blue-950 flex items-center justify-center p-4">
      <div className="w-full max-w-sm">
        <div className="flex flex-col items-center mb-6 text-white">
          <NHSMark className="w-16 h-16 mb-3" />
          <h1 className="font-serif text-2xl font-bold tracking-wide text-center">Ignite NHS</h1>
          <p className="text-blue-200 text-sm mt-1 text-center">Sign in to manage your chapter</p>
        </div>
        <Card className="p-6">
          {stage === "email" && (
            <form onSubmit={submitEmail} className="space-y-4">
              <Field label="Member email">
                <input autoFocus type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@school.edu" className={inputCls} />
              </Field>
              {error && <p className="text-sm text-red-600">{error}</p>}
              <Btn type="submit" className="w-full">Continue</Btn>
            </form>
          )}
          {stage === "code" && (
            <form onSubmit={submitCode} className="space-y-4">
              <p className="text-sm text-slate-600">Hi {matched.name.split(" ")[0]}, enter your access code.</p>
              <Field label="Access code">
                <input autoFocus type="text" required value={code} onChange={(e) => setCode(e.target.value)} className={inputCls} />
              </Field>
              {error && <p className="text-sm text-red-600">{error}</p>}
              <div className="flex gap-2">
                <Btn variant="ghost" type="button" onClick={() => { setStage("email"); setError(""); }}>Back</Btn>
                <Btn type="submit" className="flex-1">Sign in</Btn>
              </div>
            </form>
          )}
        </Card>
        <p className="text-center text-blue-300 text-xs mt-4">
          First time here? The chapter administrator ({ADMIN_EMAIL}) can sign in with just their email, then add the rest of the roster.
        </p>
      </div>
    </div>
  );
}

/* ============================== CALENDAR ============================== */

function CalendarView({ db, persist, me }) {
  const [cursor, setCursor] = useState(new Date());
  const [selectedDate, setSelectedDate] = useState(null);
  const [editingEvent, setEditingEvent] = useState(null); // event object or 'new'
  const canEdit = canManage(me, "calendar");

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const eventsByDate = useMemo(() => {
    const map = {};
    db.events.forEach((e) => {
      if (!map[e.date]) map[e.date] = [];
      map[e.date].push(e);
    });
    return map;
  }, [db.events]);

  const dateKey = (d) => `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

  const saveEvent = async (evt) => {
    const events = [...db.events];
    const idx = events.findIndex((e) => e.id === evt.id);
    if (idx >= 0) events[idx] = evt; else events.push(evt);
    await persist({ ...db, events });
    setEditingEvent(null);
  };
  const deleteEvent = async (id) => {
    await persist({ ...db, events: db.events.filter((e) => e.id !== id) });
    setEditingEvent(null);
  };

  return (
    <div className="max-w-5xl space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="font-serif text-2xl font-bold text-slate-900">Calendar</h1>
          <p className="text-slate-500 text-sm mt-0.5">
            {canEdit ? "Tap a date to add or edit an event." : "Chapter events at a glance — viewable by everyone."}
          </p>
        </div>
        <div className="flex items-center gap-1">
          <button onClick={() => setCursor(new Date(year, month - 1, 1))} className="p-2 rounded-lg border border-slate-200 hover:bg-slate-50"><ChevronLeft className="w-4 h-4" /></button>
          <span className="font-semibold text-slate-800 w-36 text-center">{cursor.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</span>
          <button onClick={() => setCursor(new Date(year, month + 1, 1))} className="p-2 rounded-lg border border-slate-200 hover:bg-slate-50"><ChevronRight className="w-4 h-4" /></button>
        </div>
      </div>

      <Card className="p-3 sm:p-4">
        <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-bold uppercase text-slate-400 mb-1">
          {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => <div key={d}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (d === null) return <div key={i} />;
            const key = dateKey(d);
            const dayEvents = eventsByDate[key] || [];
            const isToday = key === todayStr();
            return (
              <button
                key={i}
                onClick={() => setSelectedDate(key)}
                className={`aspect-square rounded-lg border p-1 flex flex-col items-start text-left overflow-hidden transition ${
                  isToday ? "border-blue-500 ring-1 ring-blue-300" : "border-slate-100"
                } ${selectedDate === key ? "bg-blue-50" : "hover:bg-slate-50"}`}
              >
                <span className={`text-xs font-semibold ${isToday ? "text-blue-700" : "text-slate-600"}`}>{d}</span>
                <div className="flex flex-wrap gap-0.5 mt-auto">
                  {dayEvents.slice(0, 3).map((e) => (
                    <span key={e.id} className="w-1.5 h-1.5 rounded-full bg-amber-500" />
                  ))}
                </div>
              </button>
            );
          })}
        </div>
      </Card>

      {selectedDate && (
        <Card className="p-5">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-serif font-bold text-slate-900">{fmtDateLong(selectedDate)}</h3>
            {canEdit && (
              <Btn variant="secondary" onClick={() => setEditingEvent({ id: uid(), title: "", date: selectedDate, time: "", location: "", description: "", volunteers: [], photos: [], createdBy: me.id })}>
                <Plus className="w-4 h-4" /> Add Event
              </Btn>
            )}
          </div>
          {(eventsByDate[selectedDate] || []).length === 0 && <EmptyRow text="No events on this day." />}
          <div className="space-y-2">
            {(eventsByDate[selectedDate] || []).map((e) => (
              <div key={e.id} className="flex items-center justify-between p-3 rounded-xl border border-slate-100">
                <div>
                  <p className="font-semibold text-sm text-slate-800">{e.title}</p>
                  <p className="text-xs text-slate-500 flex items-center gap-2 flex-wrap">
                    {e.time && <span className="flex items-center gap-1"><Clock className="w-3 h-3" />{e.time}</span>}
                    {e.location && <span className="flex items-center gap-1"><MapPin className="w-3 h-3" />{e.location}</span>}
                  </p>
                </div>
                {canEdit && (
                  <div className="flex gap-1">
                    <button onClick={() => setEditingEvent(e)} className="p-2 rounded-lg hover:bg-slate-100 text-slate-500"><Pencil className="w-4 h-4" /></button>
                    <button onClick={() => deleteEvent(e.id)} className="p-2 rounded-lg hover:bg-red-50 text-red-600"><Trash2 className="w-4 h-4" /></button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </Card>
      )}

      {!canEdit && (
        <p className="text-xs text-slate-400">Only the Head of Event Planning (and administrators) can add or edit events on the calendar.</p>
      )}

      {editingEvent && (
        <EventEditModal
          event={editingEvent}
          members={db.members}
          onClose={() => setEditingEvent(null)}
          onSave={saveEvent}
        />
      )}
    </div>
  );
}

function EventEditModal({ event, members, onClose, onSave }) {
  const [form, setForm] = useState(event);
  const [uploading, setUploading] = useState(false);

  const toggleVolunteer = (m) => {
    const exists = form.volunteers.some((v) => v.memberId === m.id);
    setForm({
      ...form,
      volunteers: exists ? form.volunteers.filter((v) => v.memberId !== m.id) : [...form.volunteers, { memberId: m.id, name: m.name }],
    });
  };

  const handlePhoto = async (fileList) => {
    setUploading(true);
    const files = Array.from(fileList).slice(0, 4);
    const newPhotos = [];
    for (const f of files) {
      if (f.size > 150 * 1024) continue; // Firestore documents cap at 1MB total, so keep images small
      const dataUrl = await fileToDataUrl(f);
      newPhotos.push({ name: f.name, dataUrl });
    }
    setForm((prev) => ({ ...prev, photos: [...(prev.photos || []), ...newPhotos] }));
    setUploading(false);
  };

  return (
    <Modal title={event.title ? "Edit Event" : "New Event"} onClose={onClose} wide>
      <div className="space-y-4">
        <Field label="Title">
          <input className={inputCls} value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="Blood Drive, Chapter Meeting…" />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Date"><input type="date" className={inputCls} value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
          <Field label="Time"><input type="time" className={inputCls} value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} /></Field>
        </div>
        <Field label="Location"><input className={inputCls} value={form.location} onChange={(e) => setForm({ ...form, location: e.target.value })} /></Field>
        <Field label="Description">
          <textarea className={inputCls} rows={3} value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
        </Field>
        <Field label="Assign volunteers">
          <div className="max-h-32 overflow-y-auto border border-slate-200 rounded-lg p-2 space-y-1">
            {members.map((m) => (
              <label key={m.id} className="flex items-center gap-2 text-sm py-1">
                <input type="checkbox" checked={form.volunteers.some((v) => v.memberId === m.id)} onChange={() => toggleVolunteer(m)} />
                {m.name} <span className="text-slate-400 text-xs">({m.role})</span>
              </label>
            ))}
          </div>
        </Field>
        <Field label="Files & photos">
          <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg py-4 text-sm text-slate-500 cursor-pointer hover:bg-slate-50">
            {uploading ? <Loader2 className="w-4 h-4 animate-spin" /> : <Upload className="w-4 h-4" />}
            Upload images (max ~150KB each)
            <input type="file" accept="image/*" multiple className="hidden" onChange={(e) => handlePhoto(e.target.files)} />
          </label>
          {form.photos && form.photos.length > 0 && (
            <div className="flex gap-2 mt-2 flex-wrap">
              {form.photos.map((p, i) => (
                <div key={i} className="relative">
                  <img src={p.dataUrl} alt={p.name} className="w-16 h-16 object-cover rounded-lg border border-slate-200" />
                  <button onClick={() => setForm({ ...form, photos: form.photos.filter((_, idx) => idx !== i) })} className="absolute -top-1.5 -right-1.5 bg-red-600 text-white rounded-full p-0.5"><X className="w-3 h-3" /></button>
                </div>
              ))}
            </div>
          )}
        </Field>
        <div className="flex justify-end gap-2 pt-2">
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={() => onSave(form)} disabled={!form.title || !form.date}>Save Event</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== EVENTS ============================== */

function EventsView({ db, persist, me }) {
  const [editingEvent, setEditingEvent] = useState(null);
  const canEdit = canManage(me, "events");
  const sorted = [...db.events].sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = sorted.filter((e) => e.date >= todayStr());
  const past = sorted.filter((e) => e.date < todayStr()).reverse();

  const saveEvent = async (evt) => {
    const events = [...db.events];
    const idx = events.findIndex((e) => e.id === evt.id);
    if (idx >= 0) events[idx] = evt; else events.push(evt);
    await persist({ ...db, events });
    setEditingEvent(null);
  };
  const deleteEvent = async (id) => {
    await persist({ ...db, events: db.events.filter((e) => e.id !== id) });
    setEditingEvent(null);
  };

  return (
    <div className="max-w-4xl space-y-6">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="font-serif text-2xl font-bold text-slate-900">Events</h1>
          <p className="text-slate-500 text-sm mt-0.5">{canEdit ? "Create events, assign volunteers, track attendance." : "Chapter event schedule."}</p>
        </div>
        {canEdit && (
          <Btn onClick={() => setEditingEvent({ id: uid(), title: "", date: todayStr(), time: "", location: "", description: "", volunteers: [], photos: [], createdBy: me.id })}>
            <Plus className="w-4 h-4" /> New Event
          </Btn>
        )}
      </div>

      <div>
        <h2 className="font-semibold text-slate-700 mb-2 text-sm uppercase tracking-wide">Upcoming</h2>
        {upcoming.length === 0 && <EmptyRow text="No upcoming events." />}
        <div className="grid sm:grid-cols-2 gap-3">
          {upcoming.map((e) => <EventCard key={e.id} e={e} canEdit={canEdit} onEdit={() => setEditingEvent(e)} onDelete={() => deleteEvent(e.id)} />)}
        </div>
      </div>

      {past.length > 0 && (
        <div>
          <h2 className="font-semibold text-slate-700 mb-2 text-sm uppercase tracking-wide">Past</h2>
          <div className="grid sm:grid-cols-2 gap-3 opacity-80">
            {past.map((e) => <EventCard key={e.id} e={e} canEdit={canEdit} onEdit={() => setEditingEvent(e)} onDelete={() => deleteEvent(e.id)} />)}
          </div>
        </div>
      )}

      {editingEvent && <EventEditModal event={editingEvent} members={db.members} onClose={() => setEditingEvent(null)} onSave={saveEvent} />}
    </div>
  );
}

function EventCard({ e, canEdit, onEdit, onDelete }) {
  return (
    <Card className="p-4">
      <div className="flex items-start justify-between">
        <div>
          <p className="font-serif font-bold text-slate-900">{e.title}</p>

            <span className="flex items-center gap-1"><CalendarDays className="w-3 h-3" />{fmtDate(e.date)}</span>
            {e.time && <span className="flex items-center gap-1"><Clock className="w-3 h-3" />{e.time}</span>}

          {e.location && <p className="text-xs text-slate-500 flex items-center gap-1 mt-0.5"><MapPin className="w-3 h-3" />{e.location}</p>}
        </div>
        {canEdit && (
          <div className="flex gap-1 shrink-0">
            <button onClick={onEdit} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><Pencil className="w-4 h-4" /></button>
            <button onClick={onDelete} className="p-1.5 rounded-lg hover:bg-red-50 text-red-600"><Trash2 className="w-4 h-4" /></button>

function MembersView({ db, persist, me }) {
  const [q, setQ] = useState("");
  const [committeeFilter, setCommitteeFilter] = useState("All");
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);

  const committees = ["All", "Executive Board", "Event Planning", "Marketing", "Finance", "Secretary", "General"];
  const filtered = db.members.filter((m) => {
    const matchQ = m.name.toLowerCase().includes(q.toLowerCase()) || m.email.toLowerCase().includes(q.toLowerCase());
    const matchC = committeeFilter === "All" || DEPARTMENTS[m.role] === committeeFilter;
    return matchQ && matchC;
  });

  const saveMember = async (member) => {
    const members = [...db.members];
    const idx = members.findIndex((m) => m.id === member.id);
    const withCommittee = { ...member, committee: DEPARTMENTS[member.role] };
    if (idx >= 0) members[idx] = withCommittee; else members.push(withCommittee);
    await persist({ ...db, members });
    setEditing(null);
  };
  const removeMember = async (id) => {
    if (id === me.id) return;
    await persist({ ...db, members: db.members.filter((m) => m.id !== id) });
    setEditing(null);
  };

  return (
    <div className="max-w-5xl space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h1 className="font-serif text-2xl font-bold text-slate-900">Members</h1>
          <p className="text-slate-500 text-sm mt-0.5">{db.members.length} total members</p>
        </div>
        {isAdminMember(me) && (
          <Btn onClick={() => setEditing({ id: uid(), name: "", email: "", role: "General Member", isAdmin: false, code: "", joinDate: todayStr(), status: "active" })}>
            <Plus className="w-4 h-4" /> Add Member
          </Btn>
        )}
      </div>

      <div className="flex gap-2 flex-wrap">
        <div className="relative flex-1 min-w-[200px]">
          <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
          <input className={`${inputCls} pl-9`} placeholder="Search by name or email…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select className={inputCls + " w-auto"} value={committeeFilter} onChange={(e) => setCommitteeFilter(e.target.value)}>
          {committees.map((c) => <option key={c}>{c}</option>)}
        </select>
      </div>

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {filtered.map((m) => {
          const { pct } = attendanceStatsFor(m.id, db.attendance);
          const wCount = db.warnings.filter((w) => w.memberId === m.id).length;
          const flagged = isFlagged(m.id, db.attendance, db.warnings).length > 0;
          return (
            <Card key={m.id} className={`p-4 ${flagged ? "border-red-200" : ""}`}>
              <div className="flex items-start justify-between">
                <button className="flex items-center gap-3 text-left" onClick={() => setViewing(m)}>
                  <div className="w-10 h-10 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center font-bold text-sm shrink-0">
                    {m.name.split(" ").map((s) => s[0]).slice(0, 2).join("")}
                  </div>
                  <div>
                    <p className="font-semibold text-sm text-slate-800">{m.name}{m.id === me.id && <span className="text-slate-400 font-normal"> (you)</span>}</p>
                    <p className="text-xs text-slate-500">{m.role}{m.isAdmin && m.role !== "President" ? " · Admin" : ""}</p>
                  </div>
                </button>
                {isAdminMember(me) && (
                  <button onClick={() => setEditing(m)} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400"><Pencil className="w-4 h-4" /></button>
                )}
              </div>
              <div className="mt-3 flex items-center gap-2 text-xs">
                <Badge className={COLORS_BY_DEPT[DEPARTMENTS[m.role]] || "bg-slate-100 text-slate-700 border-slate-200"}>{DEPARTMENTS[m.role]}</Badge>
                {pct !== null && <span className="text-slate-500">{pct}% attend.</span>}
                {wCount > 0 && <span className="text-amber-600">{wCount} warning{wCount > 1 ? "s" : ""}</span>}
                {flagged && <Flag className="w-3.5 h-3.5 text-red-500" />}
              </div>
            </Card>
          );
        })}
        {filtered.length === 0 && <p className="text-sm text-slate-400 italic">No members match your search.</p>}
      </div>

      {editing && (
        <MemberEditModal
          member={editing}
          isSelf={editing.id === me.id}
          onClose={() => setEditing(null)}
          onSave={saveMember}
          onDelete={editing.id !== me.id && db.members.some((m) => m.id === editing.id) ? () => removeMember(editing.id) : null}
        />
      )}

      {viewing && <MemberDetailModal member={viewing} db={db} persist={persist} me={me} onClose={() => setViewing(null)} />}
    </div>
  );
}

function MemberEditModal({ member, isSelf, onClose, onSave, onDelete }) {
  const [form, setForm] = useState(member);
  return (
    <Modal title={member.name ? "Edit Member" : "Add Member"} onClose={onClose}>
      <div className="space-y-4">

        <Field label="Email"><input type="email" className={inputCls} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></Field>

          <select className={inputCls} value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}>

          </select>
        </Field>

    </Modal>
  );

function MemberDetailModal({ member, db, persist, me, onClose }) {

    await persist({ ...db, warnings: [w, ...db.warnings] });
    setWNote("");
    setShowWarningForm(false);
  };

  return (
    <Modal title={member.name} onClose={onClose}>
      <div className="space-y-4">
        <div className="flex items-center gap-3">
          <div className="w-14 h-14 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center font-bold text-lg">
            {member.name.split(" ").map((s) => s[0]).slice(0, 2).join("")}
          </div>
          <div>
            <p className="font-semibold">{member.role}</p>
            <p className="text-xs text-slate-500">{member.email}</p>
          </div>
        </div>
        <div>
          <p className="text-xs font-semibold uppercase text-slate-500 mb-1">Attendance</p>
          <div className="flex items-center gap-3">
            <span className="text-2xl font-bold text-blue-900">{pct === null ? "—" : `${pct}%`}</span>
            <div className="flex-1"><ProgressBar pct={pct || 0} /></div>
          </div>
          <p className="text-xs text-slate-400 mt-1">{present} present out of {total} recorded</p>
        </div>
        <div>
          <div className="flex items-center justify-between mb-1">
            <p className="text-xs font-semibold uppercase text-slate-500">Warnings ({memberWarnings.length})</p>
            {isAdminMember(me) && !showWarningForm && (
              <button onClick={() => setShowWarningForm(true)} className="text-xs font-semibold text-blue-700 flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> Add warning</button>
            )}
          </div>
          {showWarningForm && (
            <div className="p-3 rounded-lg border border-slate-200 space-y-2 mb-2">
              <Field label="Reason">
                <select className={inputCls} value={wType} onChange={(e) => setWType(e.target.value)}>
                  <option value="attendance">Attendance Warning</option>
                  <option value="negligence">Negligence Warning</option>
                </select>
              </Field>
              <Field label="Note"><textarea rows={2} className={inputCls} value={wNote} onChange={(e) => setWNote(e.target.value)} placeholder="Explain the reason for this warning…" /></Field>
              <div className="flex justify-end gap-2">
                <Btn variant="ghost" onClick={() => setShowWarningForm(false)}>Cancel</Btn>
                <Btn disabled={!wNote.trim()} onClick={saveWarning}>Save Warning</Btn>
              </div>
            </div>
          )}
          {memberWarnings.length === 0 && !showWarningForm && <p className="text-sm text-slate-400 italic">No warnings on file.</p>}
          <div className="space-y-1.5">
            {memberWarnings.map((w) => (
              <div key={w.id} className="text-sm p-2 rounded-lg bg-amber-50 border border-amber-100">
                <span className="font-semibold capitalize">{w.type}</span> — {w.note} <span className="text-xs text-slate-400">({fmtDate(w.date)})</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </Modal>
  );
}

function AttendanceView({ db, persist, me }) {
  const canEdit = canManage(me, "attendance");
  const [eventId, setEventId] = useState(db.events[0]?.id || "");
  const [filterMember, setFilterMember] = useState("All");

  const event = db.events.find((e) => e.id === eventId);
  const recordsForEvent = db.attendance.filter((a) => a.eventId === eventId);

  const setStatus = async (memberId, status) => {
    const attendance = [...db.attendance];
    const idx = attendance.findIndex((a) => a.eventId === eventId && a.memberId === memberId);
    if (idx >= 0) attendance[idx] = { ...attendance[idx], status };
    else attendance.push({ id: uid(), eventId, memberId, status, date: event?.date || todayStr() });
    await persist({ ...db, attendance });
  };

  const filteredMemberHistory = db.members
    .filter((m) => filterMember === "All" || m.id === filterMember)
    .map((m) => ({ m, ...attendanceStatsFor(m.id, db.attendance) }));

  return (
    <div className="max-w-4xl space-y-6">
      <div>
        <h1 className="font-serif text-2xl font-bold text-slate-900">Attendance</h1>
        <p className="text-slate-500 text-sm mt-0.5">{canEdit ? "Mark attendance for meetings and events." : "View chapter attendance history."}</p>
      </div>

      {canEdit && (
        <Card className="p-5">
          <Field label="Select event / meeting">
            <select className={inputCls} value={eventId} onChange={(e) => setEventId(e.target.value)}>
              <option value="">— choose —</option>
              {[...db.events].sort((a, b) => b.date.localeCompare(a.date)).map((e) => (
                <option key={e.id} value={e.id}>{e.title} · {fmtDate(e.date)}</option>
              ))}
            </select>
          </Field>
          {eventId && (
            <div className="mt-4 space-y-1.5 max-h-96 overflow-y-auto">
              {db.members.map((m) => {
                const rec = recordsForEvent.find((r) => r.memberId === m.id);
                return (
                  <div key={m.id} className="flex items-center justify-between p-2.5 rounded-lg border border-slate-100">
                    <span className="text-sm font-medium text-slate-700">{m.name}</span>
                    <div className="flex gap-1">
                      {["present", "excused", "absent"].map((s) => (
                        <button
                          key={s}
                          onClick={() => setStatus(m.id, s)}
                          className={`text-xs px-2.5 py-1 rounded-full font-semibold capitalize border ${
                            rec?.status === s
                              ? s === "present" ? "bg-emerald-600 text-white border-emerald-600"
                              : s === "excused" ? "bg-amber-500 text-white border-amber-500"
                              : "bg-red-600 text-white border-red-600"
                              : "bg-white text-slate-500 border-slate-200 hover:bg-slate-50"
                          }`}
                        >{s}</button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {!db.events.length && <p className="text-sm text-slate-400 italic mt-2">Create an event first to take attendance.</p>}
        </Card>
      )}

      <Card className="p-5">
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <h2 className="font-serif font-bold text-slate-900">Attendance Percentages</h2>
          <select className={inputCls + " w-auto"} value={filterMember} onChange={(e) => setFilterMember(e.target.value)}>
            <option value="All">All members</option>
            {db.members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </div>
        <div className="space-y-2">
          {filteredMemberHistory.map(({ m, pct, present, total }) => (
            <div key={m.id} className="flex items-center gap-3">
              <span className="text-sm text-slate-700 w-36 truncate">{m.name}</span>
              <div className="flex-1"><ProgressBar pct={pct || 0} colorClass={pct !== null && pct < 80 ? "bg-red-500" : "bg-emerald-600"} /></div>
              <span className="text-xs text-slate-500 w-24 text-right">{pct === null ? "No data" : `${pct}% (${present}/${total})`}</span>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

function WarningsView({ db, persist, me }) {

                  <span className="text-xs text-slate-400">{fmtDate(w.date)}</span>

                <p className="text-xs text-slate-400 mt-1">Issued by {w.issuedBy}</p>

              {canAdd && <button onClick={() => removeWarning(w.id)} className="p-1.5 rounded-lg hover:bg-red-50 text-red-500 shrink-0"><Trash2 className="w-4 h-4" /></button>}

function NewWarningModal({ members, onClose, onSave }) {

      <div className="space-y-4">

          <select className={inputCls} value={memberId} onChange={(e) => setMemberId(e.target.value)}>
            {members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}

        </Field>
        <Field label="Category">
          <select className={inputCls} value={type} onChange={(e) => setType(e.target.value)}>
            <option value="attendance">Attendance Warning</option>
            <option value="negligence">Negligence Warning</option>
          </select>
        </Field>
        <Field label="Note"><textarea rows={3} className={inputCls} value={note} onChange={(e) => setNote(e.target.value)} placeholder="Explain the reason for this warning…" /></Field>
        <div className="flex justify-end gap-2">
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn disabled={!memberId || !note} onClick={() => onSave(memberId, type, note)}>Save</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== FINANCE ============================== */

function FinanceView({ db, persist, me }) {
  const canEdit = canManage(me, "finance");
  const [showNew, setShowNew] = useState(false);
  const sorted = [...db.finance].sort((a, b) => b.date.localeCompare(a.date));
  const income = db.finance.filter((f) => f.type === "income").reduce((s, f) => s + Number(f.amount), 0);
  const expense = db.finance.filter((f) => f.type === "expense").reduce((s, f) => s + Number(f.amount), 0);
  const balance = income - expense;

  const addEntry = async (entry) => {
    await persist({ ...db, finance: [{ id: uid(), ...entry, loggedBy: me.name }, ...db.finance] });
    setShowNew(false);
  };
  const removeEntry = async (id) => {
    await persist({ ...db, finance: db.finance.filter((f) => f.id !== id) });
  };

  return (
    <div className="max-w-4xl space-y-6">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="font-serif text-2xl font-bold text-slate-900">Finance</h1>
          <p className="text-slate-500 text-sm mt-0.5">Chapter budget, income, and expenses.</p>
        </div>
        {canEdit && <Btn onClick={() => setShowNew(true)}><Plus className="w-4 h-4" /> Add Entry</Btn>}
      </div>

      <div className="grid grid-cols-3 gap-3">
        <Card className="p-4"><p className="text-xs text-slate-500 flex items-center gap-1"><TrendingUp className="w-3.5 h-3.5 text-emerald-600" />Income</p><p className="text-xl font-bold text-emerald-700">${income.toFixed(2)}</p></Card>
        <Card className="p-4"><p className="text-xs text-slate-500 flex items-center gap-1"><TrendingDown className="w-3.5 h-3.5 text-red-600" />Expenses</p><p className="text-xl font-bold text-red-700">${expense.toFixed(2)}</p></Card>
        <Card className="p-4"><p className="text-xs text-slate-500">Balance</p><p className={`text-xl font-bold ${balance >= 0 ? "text-blue-900" : "text-red-700"}`}>${balance.toFixed(2)}</p></Card>
      </div>

      <Card className="p-0 overflow-hidden">
        <div className="divide-y divide-slate-100">
          {sorted.length === 0 && <p className="p-6 text-sm text-slate-400 italic">No transactions logged yet.</p>}
          {sorted.map((f) => (
            <div key={f.id} className="flex items-center justify-between p-3.5">
              <div>
                <p className="text-sm font-semibold text-slate-800">{f.description}</p>
                <p className="text-xs text-slate-500">{f.category} · {fmtDate(f.date)}</p>
              </div>
              <div className="flex items-center gap-3">
                <span className={`font-bold text-sm ${f.type === "income" ? "text-emerald-700" : "text-red-700"}`}>{f.type === "income" ? "+" : "-"}${Number(f.amount).toFixed(2)}</span>
                {canEdit && <button onClick={() => removeEntry(f.id)} className="text-slate-400 hover:text-red-600"><Trash2 className="w-4 h-4" /></button>}
              </div>
            </div>
          ))}
        </div>
      </Card>

      {showNew && <NewFinanceModal onClose={() => setShowNew(false)} onSave={addEntry} />}
    </div>
  );
}

function NewMinutesModal({ onClose, onSave }) {
  const [title, setTitle] = useState("");
  const [date, setDate] = useState(todayStr());
  const [content, setContent] = useState("");
  const [files, setFiles] = useState([]);
  const [uploading, setUploading] = useState(false);

  const handleFiles = async (fileList) => {
    setUploading(true);
    const arr = Array.from(fileList).slice(0, 3);
    const out = [];
    for (const f of arr) {
      if (f.size > 150 * 1024) continue;
      const dataUrl = await fileToDataUrl(f);
      out.push({ name: f.name, dataUrl });
    }
    setFiles((prev) => [...prev, ...out]);
    setUploading(false);
  };

  return (
    <Modal title="New Meeting Minutes" onClose={onClose} wide>
      <div className="space-y-4">
        <Field label="Title"><input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="General Meeting — October" /></Field>
        <Field label="Date"><input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Minutes"><textarea rows={6} className={inputCls} value={content} onChange={(e) => setContent(e.target.value)} /></Field>
        <Field label="Attach documents">
          <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg py-4 text-sm text-slate-500 cursor-pointer hover:bg-slate-50">
            {uploading ? <Loader2 className="w-4 h-4 animate-spin" /> : <Upload className="w-4 h-4" />}
            Upload files (max ~150KB each)
            <input type="file" multiple className="hidden" onChange={(e) => handleFiles(e.target.files)} />
          </label>
          {files.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mt-2">
              {files.map((f, i) => <Badge key={i} className="bg-slate-100 text-slate-700 border-slate-200">{f.name}</Badge>)}
            </div>
          )}
        </Field>
        <div className="flex justify-end gap-2">
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn disabled={!title || !content} onClick={() => onSave({ title, date, content, files })}>Save</Btn>
        </div>
      </div>
    </Modal>
  );
}

    <div className="max-w-5xl space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="font-serif text-2xl font-bold text-slate-900">Marketing</h1>
          <p className="text-slate-500 text-sm mt-0.5">Posters, campaigns, and scheduled announcements.</p>

        {canEdit && <Btn onClick={() => setShowNew(true)}><Plus className="w-4 h-4" /> New Campaign</Btn>}

function NewCampaignModal({ onClose, onSave }) {
  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [status, setStatus] = useState("draft");
  const [scheduledDate, setScheduledDate] = useState("");
  const [poster, setPoster] = useState(null);
  const [uploading, setUploading] = useState(false);

  const handlePoster = async (file) => {
    if (!file) return;
    if (file.size > 150 * 1024) return;
    setUploading(true);
    setPoster(await fileToDataUrl(file));
    setUploading(false);
  };

  return (
    <Modal title="New Marketing Campaign" onClose={onClose}>
      <div className="space-y-4">
        <Field label="Title"><input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} /></Field>
        <Field label="Description"><textarea rows={3} className={inputCls} value={description} onChange={(e) => setDescription(e.target.value)} /></Field>
        <Field label="Status">
          <select className={inputCls} value={status} onChange={(e) => setStatus(e.target.value)}>
            <option value="draft">Draft</option>
            <option value="scheduled">Scheduled</option>
            <option value="live">Live</option>
          </select>
        </Field>
        <Field label="Scheduled date (optional)"><input type="date" className={inputCls} value={scheduledDate} onChange={(e) => setScheduledDate(e.target.value)} /></Field>
        <Field label="Poster / media">
          <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg py-4 text-sm text-slate-500 cursor-pointer hover:bg-slate-50">
            {uploading ? <Loader2 className="w-4 h-4 animate-spin" /> : <Upload className="w-4 h-4" />}
            Upload image (max ~150KB)
            <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePoster(e.target.files[0])} />
          </label>
          {poster && <img src={poster} className="mt-2 h-24 rounded-lg border border-slate-200" />}
        </Field>
        <div className="flex justify-end gap-2">
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn disabled={!title} onClick={() => onSave({ title, description, status, scheduledDate, poster })}>Save</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== ADMIN PANEL ============================== */

function AdminPanel({ db, persist, me }) {
  const admins = db.members.filter((m) => isAdminMember(m));
  const nonAdmins = db.members.filter((m) => !isAdminMember(m));

  const toggleAdmin = async (member, value) => {
    if (member.role === "President" && !value) return; // President always admin
    const members = db.members.map((m) => (m.id === member.id ? { ...m, isAdmin: value } : m));
    await persist({ ...db, members });
  };

  return (
    <div className="max-w-3xl space-y-6">
      <div>
        <h1 className="font-serif text-2xl font-bold text-slate-900">Admin Panel</h1>
        <p className="text-slate-500 text-sm mt-0.5">Manage who has full administrator permissions.</p>
      </div>

      <Card className="p-5">
        <h2 className="font-serif font-bold text-slate-900 mb-3 flex items-center gap-2"><Shield className="w-4 h-4 text-blue-700" /> Current Administrators</h2>
        <div className="space-y-2">
          {admins.map((m) => (
            <div key={m.id} className="flex items-center justify-between p-3 rounded-xl border border-slate-100">
              <div>
                <p className="text-sm font-semibold text-slate-800">{m.name}</p>
                <p className="text-xs text-slate-500">{m.email} · {m.role}</p>
              </div>
              {m.role !== "President" && (
                <Btn variant="danger" onClick={() => toggleAdmin(m, false)}>Revoke</Btn>
              )}
              {m.role === "President" && <Badge className="bg-blue-100 text-blue-800 border-blue-200">Founding Admin</Badge>}
            </div>
          ))}
        </div>
      </Card>

      <Card className="p-5">
        <h2 className="font-serif font-bold text-slate-900 mb-3">Grant Admin Access</h2>
        <div className="space-y-2 max-h-72 overflow-y-auto">
          {nonAdmins.map((m) => (
            <div key={m.id} className="flex items-center justify-between p-3 rounded-xl border border-slate-100">
              <div>
                <p className="text-sm font-semibold text-slate-800">{m.name}</p>
                <p className="text-xs text-slate-500">{m.email} · {m.role}</p>
              </div>
              <Btn variant="secondary" onClick={() => toggleAdmin(m, true)}>Make Admin</Btn>
            </div>
          ))}
          {nonAdmins.length === 0 && <p className="text-sm text-slate-400 italic">Every member is already an admin.</p>}
        </div>
      </Card>
    </div>
  );
}

function ProfileView({ db, me }) {
  const { pct, total, present } = attendanceStatsFor(me.id, db.attendance);
  const myWarnings = db.warnings.filter((w) => w.memberId === me.id);
  const myEvents = db.events.filter((e) => e.volunteers?.some((v) => v.memberId === me.id));

  return (
    <div className="max-w-2xl space-y-4">
      <div className="flex items-center gap-4">
        <div className="w-16 h-16 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center font-bold text-xl">
          {me.name.split(" ").map((s) => s[0]).slice(0, 2).join("")}
        </div>
        <div>
          <h1 className="font-serif text-2xl font-bold text-slate-900">{me.name}</h1>
          <p className="text-slate-500 text-sm">{me.role} · {me.email}</p>
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-3">
        <Card className="p-4">
          <p className="text-xs font-semibold uppercase text-slate-500 mb-1">My Attendance</p>
          <div className="flex items-center gap-3">
            <span className="text-2xl font-bold text-blue-900">{pct === null ? "—" : `${pct}%`}</span>
            <div className="flex-1"><ProgressBar pct={pct || 0} /></div>
          </div>
          <p className="text-xs text-slate-400 mt-1">{present} present / {total} recorded</p>
        </Card>
        <Card className="p-4">
          <p className="text-xs font-semibold uppercase text-slate-500 mb-1">Warnings</p>
          <p className="text-2xl font-bold text-slate-900">{myWarnings.length}</p>
        </Card>
      </div>

      {myWarnings.length > 0 && (
        <Card className="p-5">
          <h2 className="font-serif font-bold text-slate-900 mb-2">Warning Notes</h2>
          <div className="space-y-2">
            {myWarnings.map((w) => (
              <div key={w.id} className="text-sm p-2.5 rounded-lg bg-amber-50 border border-amber-100">
                <span className="font-semibold capitalize">{w.type}</span> — {w.note} <span className="text-xs text-slate-400">({fmtDate(w.date)})</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      <Card className="p-5">
        <h2 className="font-serif font-bold text-slate-900 mb-2">Events I'm Volunteering For</h2>
        {myEvents.length === 0 && <EmptyRow text="You're not signed up for any events yet." />}
        <div className="space-y-2">
          {myEvents.map((e) => (
            <div key={e.id} className="text-sm p-2.5 rounded-lg border border-slate-100 flex justify-between">
              <span className="font-medium text-slate-700">{e.title}</span>
              <span className="text-slate-400 text-xs">{fmtDate(e.date)}</span>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}
